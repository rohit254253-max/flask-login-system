<!DOCTYPE html>
<html>
<head>

    <title>Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            background:#f5f7fa;
        }

        .navbar{
            background:#111827;
        }

        .card-box{
            border-radius:15px;
            transition:0.3s;
        }

        .card-box:hover{
            transform:translateY(-5px);
        }

    </style>

</head>

<body>

<nav class="navbar navbar-dark px-4">

    <a class="navbar-brand">
        Flask Auth System
    </a>

    <a href="/logout" class="btn btn-danger">
        Logout
    </a>

</nav>

<div class="container mt-5">

    <h2 class="mb-4">
        Welcome, {{ username }} 👋
    </h2>

    <div class="row">

        <div class="col-md-4">

            <div class="card shadow p-4 card-box">

                <h4>Total Users</h4>

                <p class="text-muted">
                    Authentication system running successfully.
                </p>

            </div>

        </div>

        <div class="col-md-4">

            <div class="card shadow p-4 card-box">

                <h4>Project Status</h4>

                <p class="text-success">
                    Active
                </p>

            </div>

        </div>

        <div class="col-md-4">

            <div class="card shadow p-4 card-box">

                <h4>Backend</h4>

                <p>
                    Flask + SQLite
                </p>

            </div>

        </div>

    </div>

</div>

</body>
</html>
