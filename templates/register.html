<!DOCTYPE html>
<html>
<head>
    <title>Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background: linear-gradient(to right,#141e30,#243b55);
        }

        .login-box{
            width:350px;
            background:white;
            padding:30px;
            border-radius:15px;
            box-shadow:0 0 20px rgba(0,0,0,0.3);
        }

        h2{
            text-align:center;
            margin-bottom:20px;
        }
    </style>

</head>
<body>

<div class="login-box">

    <h2>Register</h2>

    <form method="POST">

        <input type="text"
               name="username"
               class="form-control mb-3"
               placeholder="Enter Username"
               required>

        <input type="password"
               name="password"
               class="form-control mb-3"
               placeholder="Enter Password"
               required>

        <button class="btn btn-dark w-100">
            Create Account
        </button>

    </form>

    <div class="text-center mt-3">
        <a href="/register">
            Create Account
        </a>
    </div>

</div>

</body>
</html>
